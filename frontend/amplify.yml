version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: frontend
    env:
      variables:
        # Default environment variables (will be overridden by branch-specific ones)
        VITE_API_URL: 'http://localhost:8000'
  - branches:
      main:
        env:
          variables:
            VITE_API_URL: 'https://api.convo-book.click'
      dev:
        env:
          variables:
            VITE_API_URL: 'https://dev-api.convo-book.click' 