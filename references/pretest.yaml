pages:
  en:
    - type: "image"
      text: |
        This is the cover page of the book.
      imageUri: "images/cover.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        On a small tropical island, the sun rose high above the steamy jungle. A mother python was sending her hatchlings out into the forest the way all mother pythons do. "Grow up big and green—as green as the trees' leaves," she called to her little yellow babies as they happily scattered among the trees.
        But Verdi dawdled. He was proudly eyeing his bright yellow skin. He especially liked the bold stripes that zigzagged down his back. Why the hurry to grow up big and green? he wondered.
        Maybe some of the older snakes in the jungle could tell him. Verdi ventured into the treetops to look for them.
      imageUri: "images/page01.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Umbles, Aggie, and Ribbon were lazing on some branches nearby. Verdi peered at their droopy green bodies.
        "It's not polite to stare," chided Aggie.
        Umbles burped and groaned. "It's taken nearly four weeks for that last lizard to digest. I surely do like lizards, but lizards don't like me."
        "Why don't lizards like you?" asked Verdi.
        "Don't interrupt," Umbles grumbled.
        "Dear me," whined Aggie. "If I don't shed soon, this itchy skin will drive me bananas."
        Verdi tapped a tune with his tail as he waited to speak.
        "Stop that, Verdi. It makes me nervous," Ribbon complained. "Besides, you'll never grow up to be properly green—always interrupting and constantly fidgeting."
        Verdi couldn't imagine being in such a hurry to be like them. And he really wanted to keep his sporty stripes.
        Hoping to find snakes that weren't so boring, Verdi slipped away.
      imageUri: "images/page02.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Dozer was snoring in a tree not far from the others.
        "Hello," said Verdi. "Do you want to climb trees with me?"
        "I'm tired," Dozer growled. "Go do a few laps around the jungle, okay?"
        Verdi's heart sank. Greens were not only lazy and boring, they were rude!
      imageUri: "images/page03.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        At the top of a very tall tree, Verdi gripped one branch with his tail and another with his little snake jaws. I will never be lazy, boring, or green! he thought. I will jump and climb and keep moving so fast that I will stay yellow and striped forever.
        Then Verdi let go....
      imageUri: "images/page04.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        There is a yellow snake.
      imageUri: "images/page05.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        From a distance the greens watched. "Oh, my," they chorused.
        Ribbon shook his head. "At this rate, he'll be lucky to make it to his first molt."
        Aggie nodded. "He's likely to put an eye out on a branch."
        Umbles moaned. "He may not live to turn green."
      imageUri: "images/page06.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        But one day, Verdi’s skin began to peel, revealing a pale green stripe stretching along his whole body.
        "KACK!" he gasped. "How can this be? I'm the speediest snake in the jungle and I'm still turning green." He raced down to the river, grabbing up a mouthful of rough leaves.
      imageUri: "images/page07.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Verdi flung himself into the water. If I can't run this green off, I'll scrub it off, he thought.
      imageUri: "images/page08.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        His frantic splashing caught the eye of a large bottomfeeder cruising the murky depths.
        "Yummm," the old fish hummed. "Lunch!"
      imageUri: "images/page09.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Before the fish could haul Verdi under, the frightened snake bit him on the nose.
        Ah-POOH! With a blast of his rubbery lips, the great fish sneezed, sending Verdi into the air.
        Slapping onto the soggy shore, Verdi skidded out of reach.
      imageUri: "images/page10.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        "Whew, that was close," he sputtered. Every inch of his body was covered with wet, gloppy mud. "Hmmm. Kind of lumpy. Kind of brown. It sure beats being green."
        He left the mud on.
      imageUri: "images/page11.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        But the soft brown muck dried into a hard gray shell and Verdi could barely move. If he even budged, the stuff cracked off in jagged chunks. As each piece fell away, Verdi could see that his body was even greener than before.
        "This is terrible!" cried Verdi. He pictured himself hanging around in droopy loops, itching and complaining and worrying all day like the old greens.
        He looked up into the sky, where the sun blazed a beautiful yellow—just the color he used to be. Then he pulled a vine to the top of the tree.
      imageUri: "images/page12.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Launching himself from the treetop, Verdi startled a flock of colorful birds. He became dizzy with delight, sure the bright sun and his lofty speed would turn him golden again.
        In his joy, Verdi forgot he would fall back to earth.
      imageUri: "images/page13.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Whippety, whappity, fwip, fwap, WHAM! Plummeting through the trees, Verdi landed in a crooked sprawl across a log on the forest floor.
        He couldn't move.
        "Help," he croaked.
      imageUri: "images/page14.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        As usual, the greens had been watching Verdi's antics. They moved quickly to where he lay.
        "Didn't we say it would come to this?" Umbles said, shaking his head.
        Aggie sighed. "Lucky thing he's still got two good eyes."
        They gently lifted Verdi up to a safer place, where they could watch over him while he healed.
      imageUri: "images/page15.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Neatly splinted to a branch, Verdi had no choice but to listen to the greens as they gabbed.
        "Remember how I used to streak across the forest floor?" Ribbon asked.
        "Quick as lightning!" answered Aggie. "And I climbed giant trees like they were nothing. They grew taller then, you know."
        "The things I dared to run down and swallow!" Umbles bragged. "Wild boar were no match for me."
        Verdi was astonished. "You used to run, and climb, and hunt giant pigs? What happened?"
        "Ribbon crashed—just like you," Aggie replied. "I took a terrible fall and almost put an eye out. Then old Umbles here nearly choked to death. Now we all prefer the quiet life. A warm perch, a little sunshine, and an occasional good meal."
        The greens rambled on about their days of glory, and Verdi settled in on his branch.
      imageUri: "images/page16.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Finally one afternoon, Umbles said, "Looks like you are ready to go again." He carefully untied Verdi from the branch.
        "You are welcome to come with us," said Aggie.
        Ribbon agreed.
        The three greens slipped quietly back into the forest. Verdi wasn’t ready to join them. He wasn’t sure where he wanted to go, so he just stretched and stayed put until the sun went down. He listened to the forest come alive...
      imageUri: "images/page17.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        There are different animals in the forest.
      imageUri: "images/page18.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Time passed. The sun and moon took turns in the sky. Verdi marveled as the full moon grew thinner every night. Then he watched patiently as it slowly grew round again. He wondered why he hadn’t noticed that before.
        Verdi became so green that he blended perfectly with the leaves. He was so still that other creatures walked right by without seeing him.
      imageUri: "images/page19.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        One fine morning as Verdi basked in the sunshine, two small yellow snakes approached. They tapped and fidgeted as they stared.
        “Get a load of that old green guy,” one of them whispered. “Do you think he ever moves?”
        The other snickered. “I seriously doubt it.”
        They’re just like I used to be, thought Verdi. And I’m now what I was afraid to be. He looked at his big green body and slowly smiled. “How would you like to climb trees with me?” he asked.
        “With you?” The yellows were astounded.
        “I’ll even show you my fancy figure eight,” Verdi replied, though he was a little worried about putting his eye out.
      imageUri: "images/page20.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        With practice the three snakes performed a perfect triple figure eight.
        Leaping and looping with his little striped friends, Verdi laughed.
        "I may be big and very green, but I'm still me!"
      imageUri: "images/page21.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Retell.
      imageUri: "images/page22.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Answer comprehension questions.
      imageUri: "images/page23.jpg" # Path to image, relative to uriPrefix

    - type: "image"
      text: |
        Ask the child and their parent how they feel about the pretest. Listen carefully and warmly thank them for sharing their thoughts.
      imageUri: "images/page24.jpg"
      kidQuestions:
        - text: "Thank you for participating in our pretest. How did you feel about the experience?"
          displayText: "Thank you for participating in our pretest. How did you feel about the experience?"
          customPrompt: "listen carefully to what the child or their parent says about their experience. Warmly thank them for sharing their thoughts. Start by saying 'Thank you for sharing your thoughts.' Don't ask follow-up questions. Don't say 'Good Job'."

