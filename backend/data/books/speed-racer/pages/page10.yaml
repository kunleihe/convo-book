storyText: |
  Back at Elinor’s house, Elinor, Olive, and Ari painted their car bright
  yellow. They added a red stripe too, just like Camilla’s car. When Mr. Rabbit came
  by and saw the car, he looked curious. He was curious why the kids painted their car.
  “Why did you paint it?” asked Mr. Rabbit.
  "Well, Camilla has a fast car, and it’s yellow," Ari explained.
  "With a racing stripe, just like this!" said Olive.
  "We thought if we made our car the same color as hers, our car might go faster, too!" said Elinor.
