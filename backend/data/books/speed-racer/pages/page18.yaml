storyText: |
  Olive took out her notebook and pen from her bag. She looked closely at
  the cars and began to draw—first Camila’s car, then Elinor’s.
  "Wait a minute," said Olive, thinking hard. "I noticed something! Our car is boxy,
  but Camilla’s car has a different shape!"
