storyText: |
  The three friends looked at Camilla's car. Camilla's car was so cool—and
  really fast. It was bright yellow, with a racing stripe. It even had a nice cup
  holder inside!
  "Your car is nice, too!" said Camilla kindly.
  "Thanks, Camilla! We made it ourselves. But it’s not going as fast as yours," said
  Elinor, scratching her chin. "I wonder how we can make our car go faster."

