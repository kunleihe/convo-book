storyText: |
  Elinor, Ari, and Olive pushed their car up the hill again. As they went,
  Ari saw some fish jumping in the river. He stopped to watch them swim, but in a
  flash, the fish were gone.
  "Whoa, those are some fast fish!" said Ari.
