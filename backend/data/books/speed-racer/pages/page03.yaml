storyText: |
  Elinor, Ari, and Olive pushed their car to the top of a small hill. Elinor
  climbed in and put on her helmet. She gave a big, brave nod—she was ready! Ari and
  Olive stood behind the car, their hands ready to push.
  "Three… two… one… GO!" they shouted.
  With a big shove, the car zoomed forward!
