storyText: | 
  "With Mr. Rabbit’s help, the kids carefully cut and folded their cardboard car. 
  They made the front pointy—like a flying bird or a swimming fish. 
  "Now, it’s a lot pointier," noticed Elinor.
  "Let’s go try it!" called Ari."
