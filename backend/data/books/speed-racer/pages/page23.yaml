pageNumber: 23
imageUrl: /sample_book/images/page23.png
narrationAudioUrl: https://example.com/books/speed-racer/narration19.mp3

storyText: | 
  Mr. Rabbit heard the kids talking about the shapes of fast things. He
  walked over with a big smile on his face.
  "Oh yes," he said. "That's called being streamlined."

questions:
  - id: "q1"
    questionType: definitive-answer
    questionText: |
      Camilla's car, the bird, and the fish all look pointy in the front and round in the middle.
      What special word did Mr. Rabbit use to describe this shape?
    audioUrl: /sample_book/audios/questions/page23_q1.mp3
    answerText: Streamlined.
    follow-up:
    - Did Mr. Rabbit call it streamlined or boxy?

  - id: "q2"
    questionType: open-ended
    questionText: | 
      Another question before we turn the page! 
      What are other things in your life that have a streamlined shape?
    audioUrl: /sample_book/audios/questions/page23_q2.mp3
    answerText: As long as the child mentions one streamlined thing not covered in the story, such as airplanes, dolphins, boats or ships.
