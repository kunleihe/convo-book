storyText: |
  Olive opened her notebook again. She drew a flying bird and a swimming fish.
  "Wait a second! They''re all sort of the same shape!" shouted Ari.
  "Camilla''s car, the bird, and the fish—they are all pointy in the front and round in the middle." explained Olive.
  "And they''re all fast!" cheered Elinor.
