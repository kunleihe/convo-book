<h2>Interactive Panel — 三种状态设计</h2>
<p class="subtitle">新设计以 Avatar 为中心，移除聊天历史，聚焦当前状态</p>

<style>
  .states-row {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 24px 0;
  }
  .state-card {
    background: #fff;
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    width: 220px;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.07);
  }
  .state-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6b7280;
    background: #f3f4f6;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .bubble {
    background: #f2f2f7;
    border: 1px solid #e5e5ea;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 12px 14px;
    font-size: 14px;
    color: #333;
    line-height: 1.5;
    width: 100%;
    text-align: left;
    min-height: 60px;
  }
  .avatar-area {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-img {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid #e5e7eb;
    background: #f9fafb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  /* Speak GIF placeholder */
  .avatar-speak {
    background: linear-gradient(135deg, #fde68a, #fca5a5);
    animation: speakPulse 1.2s ease-in-out infinite;
  }
  @keyframes speakPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(252, 165, 165, 0.5); }
    50% { box-shadow: 0 0 0 8px rgba(252, 165, 165, 0); }
  }
  /* Listen GIF placeholder */
  .avatar-listen {
    background: linear-gradient(135deg, #a5f3fc, #93c5fd);
  }

  /* 3-dot loading animation */
  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: flex-start;
    padding: 8px 4px;
  }
  .dot {
    width: 10px;
    height: 10px;
    background: #9ca3af;
    border-radius: 50%;
    animation: dotBounce 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* Sound wave animation */
  .sound-wave {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 48px;
    width: 100%;
  }
  .wave-bar {
    width: 5px;
    border-radius: 3px;
    background: linear-gradient(180deg, #60a5fa, #3b82f6);
    animation: waveBounce 0.8s ease-in-out infinite;
  }
  .wave-bar:nth-child(1) { height: 12px; animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 24px; animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { height: 36px; animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { height: 44px; animation-delay: 0.3s; }
  .wave-bar:nth-child(5) { height: 36px; animation-delay: 0.15s; }
  .wave-bar:nth-child(6) { height: 24px; animation-delay: 0.05s; }
  .wave-bar:nth-child(7) { height: 12px; animation-delay: 0.25s; }
  @keyframes waveBounce {
    0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  /* Voice button styles */
  .voice-btn {
    border: none;
    border-radius: 24px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .voice-btn.ready {
    background: #3b82f6;
    color: white;
  }
  .voice-btn.recording {
    background: #ef4444;
    color: white;
  }
  .voice-btn.disabled {
    background: #e5e7eb;
    color: #9ca3af;
    cursor: not-allowed;
  }

  .arrow-down {
    font-size: 10px;
    color: #9ca3af;
    text-align: center;
  }
  .state-title {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    text-align: center;
  }
</style>

<div class="states-row">

  <!-- State 1: AI Speaking -->
  <div class="state-card">
    <div class="state-label">状态 1</div>
    <div class="state-title">AI 说话 / 问问题</div>
    <div class="bubble">
      你觉得小狐狸最后为什么选择回家？
    </div>
    <div class="arrow-down">↓</div>
    <div class="avatar-area">
      <div class="avatar-img avatar-speak">🦊</div>
    </div>
    <div class="arrow-down">Avatar: <code>speak.gif</code></div>
    <button class="voice-btn disabled">Start Speaking</button>
  </div>

  <!-- State 2: User Recording -->
  <div class="state-card">
    <div class="state-label">状态 2</div>
    <div class="state-title">用户录音中</div>
    <div class="sound-wave">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div class="arrow-down">↓</div>
    <div class="avatar-area">
      <div class="avatar-img avatar-listen">🦊</div>
    </div>
    <div class="arrow-down">Avatar: <code>listen.gif</code></div>
    <button class="voice-btn recording">Finish Speaking</button>
  </div>

  <!-- State 3: Loading -->
  <div class="state-card">
    <div class="state-label">状态 3</div>
    <div class="state-title">AI 思考中</div>
    <div class="bubble">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div class="arrow-down">↓</div>
    <div class="avatar-area">
      <div class="avatar-img avatar-listen">🦊</div>
    </div>
    <div class="arrow-down">Avatar: <code>listen.gif</code></div>
    <button class="voice-btn disabled">Start Speaking</button>
  </div>

</div>

<div class="section" style="max-width:600px;margin:0 auto;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px 18px;font-size:13px;color:#92400e;">
  <strong>说明：</strong> 当前 mockup 中的 🦊 emoji 代表位置——实际会显示 <code>speak.gif</code> / <code>listen.gif</code>。蓝绿色渐变 = listen，橙红色渐变 = speak。声波动效可在下一步调整样式。
</div>
